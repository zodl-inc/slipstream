[workspace]
members = [
    "core",
    "cli",
    "gpuhash",
    "protogen",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/zodl-inc/slipstream"
homepage = "https://github.com/zodl-inc/slipstream"
license = "AGPL-3.0-only"
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
# Intra-workspace dependencies
slipstream-gpuhash = { package = "zodl-slipstream-gpuhash", version = "0.1.2", path = "gpuhash" }

# Slipstream shared versions (P0-review carry-over). Root package keeps its own
# [dependencies] block; slipstream crates inherit from here.
# "net" is for zodl-slipstream::throttle (the v0.7 weather-machine TCP proxy).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
zcash_protocol = "=0.11.0-pre.0"
zcash_client_backend = { version = "=0.25.0-pre.1", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard"] }
rusqlite = "0.37"
# Issue #4: slipstream's own `ext_slipstream_*` schema rides the wallet DB's
# schemerz migrator (WalletMigrator::with_external_migrations) — versions match
# the ones zcash_client_sqlite itself resolves.
schemerz = "0.2"
schemerz-rusqlite = "0.370"
uuid = "1"
secrecy = "0.8"
rand = "0.10"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard = "0.16"
zcash_primitives = "=0.31.0-pre.1"
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.1", default-features = false }
zcash_script = "0.6"
tempfile = "3"          # dev-only usage; listed here for version unity
incrementalmerkletree = { version = "0.9", default-features = false }
shardtree = "0.8"
rayon = "1.7"
zip32 = "0.3"
zcash_note_encryption = "0.5.1"
zcash_address = "=0.14.0-pre.1"
# T10b spend-proof stub prover signatures only (already in the graph via sapling).
jubjub = "0.11"
bls12_381 = "0.9"

# Phase B (GPU Sinsemilla offload) — used ONLY by slipstream-gpuhash, behind the
# zodl-slipstream `gpu` feature. (Decision Log 2026-06-15, B0.1.) Versions:
# sinsemilla/group match the pasta_curves 0.6 stack already resolved by this
# workspace.
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
sinsemilla = "0.2"
group = "0.14"
pasta_curves = "0.6"
ff = "0.14"
