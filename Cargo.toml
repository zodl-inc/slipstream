[workspace]
members = [
    "core",
    "cli",
    "gpuhash",
    "protogen",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/zodl-inc/slipstream"
homepage = "https://github.com/zodl-inc/slipstream"
license = "AGPL-3.0-only"
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
# Intra-workspace dependencies
slipstream-gpuhash = { package = "zodl-slipstream-gpuhash", version = "0.1", path = "gpuhash" }

# Slipstream shared versions (P0-review carry-over). Root package keeps its own
# [dependencies] block; slipstream crates inherit from here.
# "net" is for zodl-slipstream::throttle (the v0.7 weather-machine TCP proxy).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
zcash_protocol = "0.10.2"
zcash_client_backend = { version = "0.24.0", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.22.0", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_keys = { version = "0.16.1", features = ["orchard"] }
rusqlite = "0.37"
# Issue #4: slipstream's own `ext_slipstream_*` schema rides the wallet DB's
# schemerz migrator (WalletMigrator::with_external_migrations) — versions match
# the ones zcash_client_sqlite itself resolves.
schemerz = "0.2"
schemerz-rusqlite = "0.370"
uuid = "1"
secrecy = "0.8"
rand = "0.8"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
orchard = "0.15"
zcash_primitives = "0.30.0"
transparent = { package = "zcash_transparent", version = "0.10.0", default-features = false }
zcash_script = "0.4"
tempfile = "3"          # dev-only usage; listed here for version unity
incrementalmerkletree = { version = "0.8", default-features = false }
shardtree = "0.7"
rayon = "1.7"
zip32 = "0.2"
zcash_note_encryption = "0.4.2"
zcash_address = "0.13.0"
# T10b spend-proof stub prover signatures only (already in the graph via sapling).
jubjub = "0.10"
bls12_381 = "0.8"

# Phase B (GPU Sinsemilla offload) — used ONLY by slipstream-gpuhash, behind the
# zodl-slipstream `gpu` feature. (Decision Log 2026-06-15, B0.1.) Versions:
# sinsemilla/group match the pasta_curves 0.5 stack already resolved by this
# workspace.
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
sinsemilla = "0.1"
group = "0.13"
pasta_curves = "0.5"
ff = "0.13"

# The unreleased librustzcash generation this engine builds against: the anchor-checkpoint
# ensure/retention seam (`batch_ensure_heights`) is not in any crates.io release yet, so a
# standalone `cargo test -p zodl-slipstream` cannot resolve without these. Every family crate
# is patched to the SAME rev so the graph stays a single family instance. Consumers embedding
# zodl-slipstream in their own workspace (the iOS SDK) carry an equivalent patch set at the
# workspace root — root patches govern there, and this section is ignored. Re-pin to
# crates.io at the first release that carries the seam.
[patch.crates-io]
# pczt = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
# zip321 = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
